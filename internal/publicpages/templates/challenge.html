{{define "content"}}{{with .Body}}<main class="card" id="main">
  {{template "brand" $}}
  <h1 class="h26">{{$.T "challenge.title"}}</h1>
  <p class="lead">{{$.T "challenge.text"}}</p>
  {{with .Alert}}<div class="alert" role="alert">{{.}}</div>{{end}}
  <form class="form" method="post" action="{{.Action}}" id="rc-challenge" data-error-url="{{.ErrorURL}}">
    <input type="hidden" name="challenge" value="{{.ID}}">
    <input type="hidden" name="_lang" value="{{$.Lang}}">
    <div class="cf-turnstile cf-box" data-sitekey="{{.SiteKey}}" data-error-callback="rcTurnstileError" data-response-field-name="cf-turnstile-response"></div>
    <noscript><p class="alert">{{$.T "challenge.noscript"}}</p></noscript>
    <button class="btn-pri" type="submit">{{$.T "challenge.continue"}}</button>
  </form>
</main>{{end}}{{end}}
{{define "foot"}}<footer class="foot">
  <span>{{.T "challenge.footer"}}</span>
  {{- if .PoweredBy}}{{template "sep"}}{{end}}
  {{- template "rcplain" .}}</footer>{{end}}
