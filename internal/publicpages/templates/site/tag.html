{{/* A tag's page: its name, description and feed, then its posts with paging. */}}
{{define "site-main"}}{{with .Body}}<main id="main">
<div class="st-band"><div class="st-w st-sec st-tagband"><div class="st-taghead"><span class="st-over">{{.Over}}</span><h1>{{.Heading}}</h1>{{with .Text}}<p class="ds">{{.}}</p>{{end}}<div class="st-meta"><span>{{.Count}}</span><span class="sep" aria-hidden="true">·</span><a href="{{.FeedHref}}" class="st-rc st-feedl"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a2 2 0 1 1 0 .01M3 7a6 6 0 0 1 6 6M3 3a10 10 0 0 1 10 10"></path></svg>{{.FeedText}}</a></div></div></div></div>
<div class="st-w st-listw">{{template "site-rows" .}}</div>
</main>{{end}}{{end}}
