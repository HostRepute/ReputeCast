# The license of each part of this repository, in the REUSE format
# (https://reuse.software/spec-3.3/); LICENSING.md explains it. A file takes
# the last table that matches it. `make licenses` and CI run `reuse lint`.
version = 1

# Everything not listed below: the server, the web app, the CLI, the built-in
# adapters, the migrations, the design and the docs.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 HostRepute"
SPDX-License-Identifier = "AGPL-3.0-only"

# Code that runs inside other people's programs and sites: the client SDKs,
# the OpenAPI documents, the adapter SDK, the integration apps, and the
# scripts and styles that sites embed.
[[annotations]]
path = [
  "sdk/**",
  "integrations/**",
  "internal/tracker/static/**",
  "internal/push/static/**",
  "internal/forms/embed/**",
]
SPDX-FileCopyrightText = "2026 HostRepute"
SPDX-License-Identifier = "MIT"

# The WordPress plugin: WordPress.org asks for a GPL-compatible license.
[[annotations]]
path = "integrations/wordpress/**"
SPDX-FileCopyrightText = "2026 HostRepute"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Made to be copied: no notice to keep.
[[annotations]]
path = ["sdk/adapter-template/**", "internal/templates/starters/**"]
SPDX-FileCopyrightText = "2026 HostRepute"
SPDX-License-Identifier = "MIT-0"

# The name and logos (TRADEMARKS.md).
[[annotations]]
path = "brand/**"
SPDX-FileCopyrightText = "2026 HostRepute"
SPDX-License-Identifier = "LicenseRef-ReputeCast-Trademarks"

# IBM Plex. "override": the license texts' own wording isn't a copyright line.
[[annotations]]
path = "internal/countdown/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "internal/publicpages/static/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2019 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"
