version: "2"
run:
  # The whole module takes a few minutes cold, more on a busy CI runner.
  timeout: 15m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Writes to a command's output: nothing useful to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
        - G115 # integer overflow conversions are reviewed case by case
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
          disabled: true
  exclusions:
    generated: strict
    paths:
      - internal/store
      - tmp
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hostrepute/reputecast
