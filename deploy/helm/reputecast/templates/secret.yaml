{{- /* Credentials given in values: the database URL and the bucket's keys. */}}
{{- $db := not .Values.database.existingSecret }}
{{- $s3 := include "reputecast.s3KeysInline" . }}
{{- if or $db $s3 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reputecast.fullname" . }}
  labels:
    {{- include "reputecast.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $db }}
  database-url: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
  {{- if $s3 }}
  s3-access-key-id: {{ .Values.storage.s3.accessKeyID | b64enc | quote }}
  s3-secret-access-key: {{ .Values.storage.s3.secretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
