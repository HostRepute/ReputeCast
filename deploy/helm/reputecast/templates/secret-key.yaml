{{- /*
The key that encrypts secrets at rest. Generated once: an upgrade reads it
back from the cluster, and an uninstall leaves the Secret (resource-policy
keep), because stored credentials can't be decrypted without it.
*/}}
{{- if not .Values.secretKey.existingSecret }}
{{- $name := printf "%s-key" (include "reputecast.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := dig "data" "secret-key" "" $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "reputecast.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ $key | default (randBytes 32 | b64enc) | quote }}
{{- end }}
