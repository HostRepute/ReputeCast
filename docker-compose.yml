# Development services: Postgres and Mailpit. The app itself runs on the host
# with `make dev` (air + Vite). For a production-style stack see deploy/.
name: reputecast-dev

services:
  postgres:
    image: postgres:18-alpine
    # Integration tests clone a database per test, and `go test ./...` runs
    # packages in parallel: allow more connections than the default 100.
    command: ["postgres", "-c", "max_connections=300"]
    # Parallel queries take dynamic shared memory from /dev/shm; Docker's
    # 64 MB default runs out under many concurrent test databases.
    shm_size: 1g
    environment:
      POSTGRES_USER: reputecast
      POSTGRES_PASSWORD: reputecast
      POSTGRES_DB: reputecast
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reputecast -d reputecast"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  pgdata:
