name: Load test

# Run by hand (Actions › Load test › Run workflow): a million contacts by
# default, the hot queries' targets and timings, the delivery_events
# partition conversion on that data, and the k6 scripts against a running
# server (review 2026-11 OP-9). Results are kept as an artifact; record
# them in docs/deploy/performance.md.

on:
  workflow_dispatch:
    inputs:
      contacts:
        description: Contacts in the load test workspace
        default: "1000000"
      postgres:
        description: Postgres major version
        default: "18"
  # A pull request labelled "load-test" runs it too, with the defaults: a
  # workflow that isn't on the default branch yet can't be run by hand.
  # The label needs write access, and a pull_request run gets no secrets.
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  load:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'load-test'
    name: Load test · ${{ inputs.contacts || '1000000' }} contacts · Postgres ${{ inputs.postgres || '18' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:${{ inputs.postgres || '18' }}-alpine
        env:
          POSTGRES_USER: reputecast
          POSTGRES_PASSWORD: reputecast
          POSTGRES_DB: reputecast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reputecast" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      REPUTECAST_ENV: development
      REPUTECAST_DATABASE__URL: postgres://reputecast:reputecast@localhost:5432/reputecast?sslmode=disable
      REPUTECAST_LOAD_DATABASE_URL: postgres://reputecast:reputecast@localhost:5432/reputecast?sslmode=disable
      REPUTECAST_HTTP__RATE_LIMIT_API: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - run: go build -o bin/reputecast ./cmd/reputecast
      # Every step below runs under pipefail, so a threshold that k6 or a
      # timing test crosses fails the job; the steps after it still run, so
      # one run records every number.
      - name: Seed
        id: seed
        shell: bash
        run: |
          export REPUTECAST_SECRETS__KEY_FILE="$RUNNER_TEMP/secret.key"
          ./bin/reputecast seed
          ./bin/reputecast seed --sample load --contacts "${{ inputs.contacts || '1000000' }}" | tee results.txt
      - name: Hot queries (targets and timings)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        shell: bash
        run: go test -count=1 -v -run 'TestAudienceAtOneMillion|TestReportTimes|TestConcurrentBrowse' ./internal/loadtest/ | tee -a results.txt
      - name: Benchmarks
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        shell: bash
        run: go test -count=1 -run '^$' -bench . -benchtime 50x ./internal/loadtest/ | tee -a results.txt
      - name: Partition delivery_events, then time again
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        shell: bash
        run: |
          ./bin/reputecast migrate partition-events | tee -a results.txt
          go test -count=1 -v -run 'TestReportTimes' ./internal/loadtest/ | tee -a results.txt
      - name: Start the server
        id: server
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        shell: bash
        run: |
          export REPUTECAST_SECRETS__KEY_FILE="$RUNNER_TEMP/secret.key"
          ./bin/reputecast serve > server.log 2>&1 &
          for i in $(seq 1 60); do ./bin/reputecast healthcheck && break; sleep 2; done
          echo "COOKIE=$(sh loadtest/session.sh load-test)" >> "$GITHUB_ENV"
          # send.js sends with a send-only key, as an application does: a
          # session's 50 per second would be what it measured.
          token=$(COOKIE="$(sh loadtest/session.sh acme-newsletter)" sh loadtest/sendkey.sh acme-newsletter 1000)
          test -n "$token"
          echo "::add-mask::$token"
          echo "SEND_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: grafana/setup-k6-action@v1
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
      - name: k6
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        shell: bash
        run: |
          status=0
          k6 run --summary-export k6-contacts.json loadtest/k6/contacts.js | tee -a results.txt || status=1
          k6 run --summary-export k6-segments.json loadtest/k6/segments.js | tee -a results.txt || status=1
          TOKEN="$SEND_TOKEN" k6 run --summary-export k6-send.json loadtest/k6/send.js | tee -a results.txt || status=1
          curl -s localhost:9464/metrics | grep -E '^reputecast_(jobs|job_queue_lag|provider|ingest)' | tee -a results.txt || true
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test-${{ inputs.contacts || '1000000' }}-pg${{ inputs.postgres || '18' }}
          path: |
            results.txt
            k6-*.json
            server.log
