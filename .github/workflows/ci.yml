name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true

  smoke:
    name: Web · smoke test, accessibility sweep, bundle budget
    runs-on: ubuntu-latest
    # Against the real server with the demo data (review 2026-11 FE-8).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: reputecast
          POSTGRES_PASSWORD: reputecast
          POSTGRES_DB: reputecast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reputecast" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      REPUTECAST_ENV: development
      REPUTECAST_DATABASE__URL: postgres://reputecast:reputecast@localhost:5432/reputecast?sslmode=disable
      REPUTECAST_PUBLIC_URL: http://localhost:8080
      REPUTECAST_AUTH__COOKIE_SECURE: "false"
      REPUTECAST_HTTP__RATE_LIMIT_API: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Bundle budget
        run: pnpm budget
        working-directory: web
      - name: Seed and start the server
        run: |
          export REPUTECAST_SECRETS__KEY_FILE="$RUNNER_TEMP/secret.key"
          go build -o bin/reputecast ./cmd/reputecast
          ./bin/reputecast seed
          ./bin/reputecast serve > server.log 2>&1 &
          for i in $(seq 1 60); do ./bin/reputecast healthcheck && break; sleep 2; done
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Smoke test
        run: SMOKE_URL=http://localhost:8080 pnpm e2e
        working-directory: web
      - name: Accessibility sweep (axe, WCAG 2.2 AA)
        run: node scripts/a11y.ts --app http://localhost:8080 --widths 1440,390 --out ../a11y
        working-directory: web
      # The same screens in the dark theme (M54): the device prefers dark.
      - name: Accessibility sweep, dark theme
        run: node scripts/a11y.ts --app http://localhost:8080 --widths 1440,390 --theme dark --out ../a11y-dark
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: |
            web/playwright-report
            a11y
            a11y-dark
            server.log

  go:
    name: Go ${{ matrix.go }} · Postgres ${{ matrix.pg }} · shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27.x"]
        pg: ["16", "17", "18"]
        # Each Postgres version's tests in three shards that take about as
        # long as each other (scripts/testshard). internal/approvals, the
        # slowest package, is split test by test across them.
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: reputecast
          POSTGRES_PASSWORD: reputecast
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reputecast" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      REPUTECAST_TEST_DATABASE_URL: postgres://reputecast:reputecast@localhost:5432/postgres?sslmode=disable
    steps:
      # A runner guarantees only 14 GB of free disk, and the Go jobs can need
      # more: go keeps each package it compiles twice, in its build cache and
      # in its work directory, until the command ends. The runner comes with
      # toolsets none of these jobs use; this removes the largest.
      - name: Free disk space
        run: |
          before=$(df -h --output=avail / | tail -1 | xargs)
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "::notice title=Disk space::$before free, $(df -h --output=avail / | tail -1 | xargs) after removing unused toolsets"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # Failing tests and their messages as annotations on the pull request.
      - run: echo "::add-matcher::.github/go-test-matcher.json"
      # Under -race the demo-heavy packages take longer than go test's
      # default 10 minutes per package on a CI runner. The shard's lines
      # are "import/path", or "import/path run|skip regexp" for its part of
      # a split package, which that package's TestMain reads from
      # REPUTECAST_TEST_RUN (internal/testsplit).
      - name: go test (shard ${{ matrix.shard }} of 3)
        run: |
          lines=$(go list ./... | go run ./scripts/testshard -shard ${{ matrix.shard }} -of 3)
          echo "::group::$(wc -l <<<"$lines") packages in this shard"
          echo "$lines"
          echo "::endgroup::"
          export REPUTECAST_TEST_RUN=$(awk 'NF == 3' <<<"$lines")
          go test -race -count=1 -timeout 45m $(cut -d' ' -f1 <<<"$lines")

  go-checks:
    name: Go · generated code, go vet
    runs-on: ubuntu-latest
    # Apart from the test shards: go vet alone takes about half an hour on
    # a runner, and neither check needs Postgres.
    steps:
      # As in the go job.
      - name: Free disk space
        run: |
          before=$(df -h --output=avail / | tail -1 | xargs)
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "::notice title=Disk space::$before free, $(df -h --output=avail / | tail -1 | xargs) after removing unused toolsets"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Generated code is up to date
        run: |
          go tool sqlc generate
          go run ./cmd/reputecast openapi > web/openapi.json
          git diff --exit-code -- internal/store web/openapi.json
      - run: go vet ./...

  vulns:
    name: Security · known vulnerabilities
    runs-on: ubuntu-latest
    # Known vulnerabilities in what ships: the Go code's reachable calls
    # (govulncheck, pinned) and the web app's production dependencies.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      # v1.1.4's go/ssa (x/tools 0.29) can't read Go 1.27 code and panics;
      # pin a release built against current x/tools.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm audit --prod --audit-level moderate
        working-directory: web

  golangci:
    name: golangci-lint (${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every third package, linted side by side. Most of a lint is loading
        # the packages, which compiles them. Tests that import a package
        # importing the one they test, as tests using internal/apptest do
        # (internal/app imports nearly everything), need it compiled again
        # against that package with its test files: 1,406 such copies for
        # 197 packages. A part compiles only the copies its own tests need.
        part: [1, 2, 3]
    steps:
      # As in the go job.
      - name: Free disk space
        run: |
          before=$(df -h --output=avail / | tail -1 | xargs)
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "::notice title=Disk space::$before free, $(df -h --output=avail / | tail -1 | xargs) after removing unused toolsets"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Packages of this part
        id: part
        run: echo "packages=$(go list -f '{{.Dir}}' ./... | awk 'NR % 3 == ${{ matrix.part }} - 1' | sed "s|^$PWD|.|" | xargs)" >> "$GITHUB_OUTPUT"
      # golangci-lint's cache: each package's results, and the facts its
      # analyzers keep about the packages it imports, as main's latest lint
      # of this part left them. Runs on main save it; pull requests only
      # restore it.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ matrix.part }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ matrix.part }}-${{ hashFiles('go.sum') }}-
            golangci-${{ matrix.part }}-
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ${{ steps.part.outputs.packages }}
          # The action's own cache is saved once a week and shared by the
          # three parts; the one above replaces it.
          skip-cache: true
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ matrix.part }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  adapter-sdk:
    name: Adapter SDK · typecheck, test, build, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdk/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      # Installing also builds the SDK (its prepare script): the template
      # imports it from dist/.
      - run: pnpm install --frozen-lockfile
        working-directory: sdk
      - run: pnpm typecheck
        working-directory: sdk
      - run: pnpm build
        working-directory: sdk
      # SDK unit tests, the template's tests and its contract suite
      # (npx reputecast-adapter test).
      - run: pnpm test
        working-directory: sdk
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      # The template run as a Node process, through the Go runtime, against
      # the shared contract suite (internal/providers/contracttest).
      - name: Template adapter through the Go runtime
        env:
          REPUTECAST_ADAPTER_E2E: required
        run: go test -count=1 -run 'TestTemplateAdapterEndToEnd|TestContract' ./internal/providers/remote/

  site:
    name: Site · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm lint
        working-directory: site
      - run: pnpm typecheck
        working-directory: site
      - run: pnpm test
        working-directory: site
      - name: GitHub star count (main)
        if: github.event_name == 'push'
        run: |
          stars=$(gh api "repos/$GITHUB_REPOSITORY" --jq .stargazers_count 2>/dev/null || true)
          if [ -n "$stars" ]; then echo "SITE_GITHUB_STARS=$stars" >> "$GITHUB_ENV"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Prerendered build; no network (the GitHub star count is optional).
      - run: pnpm build
        working-directory: site
        env:
          SITE_OFFLINE: "1"
      - name: The prerendered page is complete HTML
        working-directory: site
        run: |
          grep -q 'The newsletter platform that protects your inbox placement.</h1>' dist/index.html
          grep -q '"@type": "SoftwareApplication"' dist/index.html
          test -f dist/sitemap.xml && test -f dist/robots.txt && test -f dist/og.png
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: site
      # axe from 320 to 1440 px, the keyboard, the pickers without JavaScript,
      # reflow and forced colours, against the build above.
      - name: Browser checks
        run: pnpm e2e
        working-directory: site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-e2e
          path: |
            site/playwright-report
            site/test-results
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist

  # Deploys reputecast.com (Cloudflare Pages, project reputecast-site) from
  # main; needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
  site-deploy:
    name: Site · deploy reputecast.com
    needs: site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=reputecast.com was not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the site from main."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: pages deploy dist --project-name=reputecast-site --branch=main --commit-hash=${{ github.sha }}
      # Cloudflare can rewrite the page on its way to visitors: Email Address
      # Obfuscation once turned the install command into "[email protected]".
      - name: reputecast.com serves the page as built
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for _ in 1 2 3 4 5 6; do
            code=$(curl -sS -o live.html -w '%{http_code}' https://reputecast.com/ || true)
            if [ "$code" = 200 ] && cmp -s live.html dist/index.html; then exit 0; fi
            sleep 10
          done
          if [ "$code" != 200 ]; then
            echo "::warning title=reputecast.com wasn't checked::It answered HTTP $code."
            exit 0
          fi
          diff <(tr '>' '\n' < dist/index.html) <(tr '>' '\n' < live.html) | head -40 || true
          echo "::error title=reputecast.com differs from the build::Something between Cloudflare Pages and visitors changes the page, such as Email Address Obfuscation or an injected script. The diff is above."
          exit 1

  # The integration apps (integrations/): each checks its requests and
  # mocked answers against web/openapi.json, so an API change that breaks
  # an app fails here.
  zapier:
    name: Zapier app · lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json
      - run: npm ci
        working-directory: integrations/zapier
      # eslint, then zapier-platform validate (the app's definition).
      - run: npm run lint
        working-directory: integrations/zapier
      - run: npm test
        working-directory: integrations/zapier
      - run: npm run build
        working-directory: integrations/zapier

  make:
    name: Make app · validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # No dependencies: the IML checks and the contract are plain Node.
      - run: npm run lint
        working-directory: integrations/make
      - run: npm test
        working-directory: integrations/make
      - run: npm run build
        working-directory: integrations/make

  n8n:
    name: n8n nodes · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: integrations/n8n/package-lock.json
      - run: npm ci
        working-directory: integrations/n8n
      # n8n's community-node linter, in strict mode.
      - run: npm run lint
        working-directory: integrations/n8n
      - run: npm run typecheck
        working-directory: integrations/n8n
      - run: npm test
        working-directory: integrations/n8n
      - run: npm run build
        working-directory: integrations/n8n

  wordpress:
    name: WordPress plugin · PHP ${{ matrix.php }} · lint, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: integrations/wordpress
      # Parses every file with this PHP, then the WordPress Coding Standards.
      - run: composer lint
        working-directory: integrations/wordpress
      - run: composer test
        working-directory: integrations/wordpress
      - run: composer build
        working-directory: integrations/wordpress
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.4'
        with:
          name: wordpress-plugin
          path: integrations/wordpress/dist/*.zip

  release-config:
    name: GoReleaser · check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
