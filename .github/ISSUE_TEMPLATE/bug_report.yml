name: Bug report
description: Something in ReputeCast doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For a security problem, follow [SECURITY.md](https://github.com/hostrepute/reputecast/blob/main/SECURITY.md) instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Instance admin › Instance & updates shows it, or run `reputecast version`.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run ReputeCast?
      options:
        - Docker Compose
        - Docker, another way
        - Release binary
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: postgres
    attributes:
      label: Postgres version
      options:
        - "18"
        - "17"
        - "16"
        - Other or not sure
  - type: input
    id: provider
    attributes:
      label: Sending providers involved
      description: If the problem is about sending, webhooks or provider health.
      placeholder: Amazon SES, Postmark, SMTP…
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove email addresses, API keys and other secrets first.
      render: text
